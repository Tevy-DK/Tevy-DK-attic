name: Auto update binaries

on:
  schedule:
    # Twice a day: 00:00 and 12:00 UTC.
    - cron: "0 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Never let two updaters race on main.
concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  update:
    # The commit step pushes to main; never run it from another ref.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Allow unprivileged user namespaces
        # appimageTools.wrapType2 runs the payload inside a bubblewrap FHS
        # sandbox, and Ubuntu 24.04+ denies unprivileged user namespaces to
        # unconfined programs through AppArmor.  Without this, every
        # AppImage-based smoke test dies with
        #   bwrap: setting up uid map: Permission denied
        run: |
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-root-user true

      - name: Update packages, verify builds, commit and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: nix develop --command bash scripts/auto-update.sh --commit
